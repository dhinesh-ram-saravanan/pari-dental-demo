<!doctype html>
<html lang="en" data-palette="linen" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pari Dental Hospital – Clinic app preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f2ee;--surface:#ffffff;--sunk:#eaece7;--ink:#14201c;--muted:#5c6964;--line:#dce1db;
  --pri:#1d4a3f;--pri-ink:#ffffff;--pri-soft:#e1ebe5;--brass:#ad874b;
  --side-bg:#0f231e;--side-ink:#eef2ef;--side-muted:#9cb1a9;--side-hover:#183129;--side-active:#213f36;
  --ok:#2c7650;--ok-soft:#e2f0e6;--warn:#9b5f17;--warn-soft:#f6ecdc;--bad:#a5322a;--bad-soft:#f8e8e5;
  --enamel:#fbfaf6;--root:#ece2cf;--tline:#99a39e;
  --t-decay:#c27a2a;--t-filled:#3a6898;--t-rct:#7a4b76;--t-crown:#ad874b;--t-implant:#2a786a;--t-missing:#99a39e;
  --lift:0 1px 2px rgba(16,24,40,.05),0 0 0 1px var(--line);
  --float:0 10px 30px rgba(16,24,40,.16),0 0 0 1px rgba(16,24,40,.06);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1311;--surface:#131c19;--sunk:#1a2420;--ink:#e6ece8;--muted:#97a8a1;--line:#25312d;
  --pri:#8cc7b1;--pri-ink:#0b1f1a;--pri-soft:#1a2f28;--brass:#c9a46a;
  --side-bg:#080e0c;--side-ink:#e6ece8;--side-muted:#8ea39b;--side-hover:#13201b;--side-active:#1b2d27;
  --ok:#6fcf9c;--ok-soft:#14301f;--warn:#e2b06a;--warn-soft:#30250f;--bad:#ee8a7f;--bad-soft:#3a1a16;
  --enamel:#ebe7dc;--root:#c9bca2;--tline:#6f7b76;
  --t-decay:#e09a45;--t-filled:#6f9bd0;--t-rct:#b083ab;--t-crown:#c9a46a;--t-implant:#4fb09c;--t-missing:#5c6964;
  --lift:0 0 0 1px var(--line);--float:0 10px 30px rgba(0,0,0,.5),0 0 0 1px var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1311;--surface:#131c19;--sunk:#1a2420;--ink:#e6ece8;--muted:#97a8a1;--line:#25312d;
  --pri:#8cc7b1;--pri-ink:#0b1f1a;--pri-soft:#1a2f28;--brass:#c9a46a;
  --side-bg:#080e0c;--side-ink:#e6ece8;--side-muted:#8ea39b;--side-hover:#13201b;--side-active:#1b2d27;
  --ok:#6fcf9c;--ok-soft:#14301f;--warn:#e2b06a;--warn-soft:#30250f;--bad:#ee8a7f;--bad-soft:#3a1a16;
  --enamel:#ebe7dc;--root:#c9bca2;--tline:#6f7b76;
  --t-decay:#e09a45;--t-filled:#6f9bd0;--t-rct:#b083ab;--t-crown:#c9a46a;--t-implant:#4fb09c;--t-missing:#5c6964;
  --lift:0 0 0 1px var(--line);--float:0 10px 30px rgba(0,0,0,.5),0 0 0 1px var(--line);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--paper);background-image:var(--bg-fade,none);background-attachment:fixed;color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--paper);background-image:var(--bg-fade,none);background-attachment:fixed;color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--surface);box-shadow:1px 0 0 var(--line);z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{display:block;font-size:15px;line-height:1.25}
.logo{flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.demo{font-size:11px;font-weight:700;color:var(--warn)}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .15s,color .15s}
#nav a:hover{background:var(--sunk);color:var(--ink)}
#nav a.on{background:var(--pri-soft);color:var(--pri)}
#nav svg{flex:0 0 18px}
.count{margin-left:auto;min-width:22px;text-align:center;background:var(--pri);color:var(--pri-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
.golive{margin:0 0 10px}
.who{margin-top:auto;padding:0 6px}
.who label{margin:0}
main{padding:30px 34px 110px;max-width:1260px;width:100%}
.app.bare{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.app.bare main{margin:0 auto}
.app.bare #side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 20px}
.app.kiosk #side{display:none}
.livebar{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
.livebar .grow{flex:1}
.livebar select{width:auto}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@media(max-width:899px){
  .app{grid-template-columns:1fr}
  #side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand who" "nav nav";gap:8px;padding:10px 12px 0}
  .brand{grid-area:brand;padding:0}.who{grid-area:who;margin:0;padding:0}.who label{flex-direction:row;align-items:center;font-size:12px}.who select{width:auto;max-width:150px;padding:6px 8px}
  #nav{grid-area:nav;flex-direction:row;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 8px 8px}
  #nav a{padding:7px 10px}#nav a .count{margin-left:4px}
  .golive{margin:0}
  main{padding:18px 14px 110px}
}

/* type + basics */
h1{font-size:28px;line-height:1.15;font-weight:750;letter-spacing:-.022em;margin:0}
h2{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:4px 0 0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pact{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border-radius:14px;box-shadow:var(--lift);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:899px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri);margin:0}
textarea{resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 14px}
.span2{grid-column:1/-1}
@media(max-width:600px){.fgrid,.fgrid3{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{flex-direction:row;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:7px 13px;margin:0;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;transition:background-color .15s}
.chip:has(input:checked){background:var(--pri-soft);color:var(--pri)}
.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:500;font-size:14px}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--sunk);color:var(--ink);border-radius:9px;padding:9px 14px;min-height:40px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background-color .15s,transform .1s}
.btn:hover{background:color-mix(in srgb,var(--sunk) 70%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--pri) 88%,var(--ink))}
.btn.sm{padding:6px 11px;font-size:13px;min-height:34px}
.btn.lg{padding:12px 20px;font-size:15px;min-height:46px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.wa{background:#25d366;color:#05301a}
.btn:disabled{opacity:.6;cursor:wait}
.icon{border:0;background:transparent;color:var(--muted);border-radius:9px;width:40px;height:40px;flex:0 0 40px;cursor:pointer;font-size:20px;line-height:1}
.icon:hover{background:var(--sunk);color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.pri{background:var(--pri-soft);color:var(--pri)}
.alerts{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td select{width:auto;padding:6px 8px}
.row-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row-item:last-child{border-bottom:0}
.row-item.click{cursor:pointer}
.row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-actions select,.row-actions input{width:auto}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty p{margin:0 0 14px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}

/* dashboard */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border-radius:14px;box-shadow:var(--lift);margin-bottom:16px;overflow:hidden}
.ledger>div{padding:16px 18px;box-shadow:-1px 0 0 var(--line)}
.fig-l{font-size:13px;color:var(--muted);font-weight:600}
.fig-v{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.fig-s{font-size:12px;color:var(--muted)}
.prog{width:96px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px}

/* queue */
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.tok{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:750;font-variant-numeric:tabular-nums}
.qrow.in .tok{background:var(--warn-soft);color:var(--warn)}
.qmeta{font-size:13px;color:var(--muted)}
.late{color:var(--warn);font-weight:600}
@media(max-width:700px){.qrow{grid-template-columns:40px minmax(0,1fr)}.qrow>.qdoc,.qrow>.qact{grid-column:2}}

/* live */
.chair{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:24px 26px 24px 32px;border-radius:18px;background:var(--surface);box-shadow:var(--lift);margin-bottom:18px;overflow:hidden}
.chair::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--ok)}
.chair.busy::before{background:var(--warn)}
.chair-k{font-size:13px;font-weight:600;color:var(--muted)}
.chair-name{font-size:32px;font-weight:750;letter-spacing:-.025em;line-height:1.15;margin:2px 0 8px}
@media(max-width:600px){.chair{grid-template-columns:1fr}.chair-name{font-size:26px}}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.col{background:var(--sunk);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px 6px}
.qcard{background:var(--surface);border-radius:8px;padding:12px;box-shadow:var(--lift)}
.qcard select{width:auto;max-width:60%;padding:6px 8px;font-size:13px}
.qcard.late{box-shadow:inset 3px 0 0 var(--warn),var(--lift)}
.qcard-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qcard-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}

/* tooth chart */
.chart-wrap{overflow-x:auto;margin:0 -4px;padding:4px}
.chart{min-width:660px;display:flex;flex-direction:column;gap:4px;align-items:center}
.arch{display:flex;gap:12px;align-items:flex-end}
.arch.down{align-items:flex-start}
.half{display:flex;gap:1px}
.mid{width:1px;align-self:stretch;background:var(--line)}
.jaw{font-size:11px;color:var(--muted);font-weight:600;width:100%;display:flex;justify-content:space-between;padding:0 6px}
.tooth{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:5px 2px;border-radius:9px;color:var(--muted);font:700 11px/1 "Public Sans",sans-serif;font-variant-numeric:tabular-nums;transition:background-color .12s}
button.tooth{cursor:pointer}
button.tooth:hover{background:var(--sunk)}
.arch.down .tooth{flex-direction:column-reverse}
.tooth svg{display:block}
.tooth .cr{fill:var(--enamel);stroke:var(--tline);stroke-width:1.2;transition:stroke .12s}
.tooth .rt{fill:var(--root);stroke:var(--tline);stroke-width:1.2}
button.tooth:hover .cr{stroke:var(--pri)}
.tooth.sel{background:var(--pri-soft);color:var(--pri)}
.tooth.sel .cr{stroke:var(--pri);stroke-width:2.2}
.tooth.s-crown .cr{fill:var(--t-crown)}
.tooth.s-missing svg{opacity:.4}
.tooth.s-missing .cr,.tooth.s-missing .rt{fill:transparent;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);justify-content:center;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.marks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:14px;box-shadow:0 -1px 0 var(--line)}
.mk{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:34px;transition:background-color .12s,transform .1s}
.mk:active{transform:scale(.96)}
.mk i{width:10px;height:10px;border-radius:3px}
.mk:disabled{opacity:.45;cursor:not-allowed}

/* consultation */
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.chead .alerts{margin-top:10px}
.consult{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.cside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media(max-width:1099px){.consult{grid-template-columns:1fr}.cside{position:static;max-height:none}}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:750;margin-right:10px;vertical-align:1px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0}
.svc-row{display:flex;gap:8px;margin-bottom:8px}
.svc-row select{flex:2;min-width:0}.svc-row input{flex:1.4;min-width:0}.svc-row .price{flex:0 0 110px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rxchip{font:inherit;font-size:13px;border:0;background:var(--sunk);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-height:34px}
.rxchip:hover{background:var(--pri-soft);color:var(--pri)}
.pay{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:end;background:var(--sunk);border-radius:12px;padding:14px;margin-top:6px}
.pay label{margin:0}.pay b{font-size:24px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media(max-width:600px){.pay{grid-template-columns:1fr}}
.savebar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--ink);color:var(--paper);padding:10px 10px 10px 20px;border-radius:16px;box-shadow:var(--float);z-index:5}
.savebar b{display:block}
.savebar span{font-size:13px;opacity:.75}
.savebar .btn.primary{flex:0 0 auto}

/* history */
.case{padding:12px 0;border-bottom:1px solid var(--line)}
.case:last-child{border-bottom:0}
.case-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tl{list-style:none;margin:12px 0 0 5px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 4px;font-size:14px}
.tl li:last-child{padding-bottom:2px}
.tl li::before{content:"";position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--pri)}
.tl-h{display:flex;justify-content:space-between;gap:8px}
.rx{font-size:13px;background:var(--pri-soft);padding:6px 10px;border-radius:8px;margin-top:4px;white-space:pre-line}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{border:0;padding:0;background:none;cursor:pointer;color:var(--muted);font:inherit;font-size:11px;text-align:left}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:8px;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.thumb span{display:block;margin-top:4px}

/* checkout */
.co{border-radius:12px;background:var(--sunk);padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.co-block{background:var(--surface);border-radius:8px;padding:12px}
.co-block .row-actions input,.co-block .row-actions select{width:auto}

/* kiosk */
.kiosk{max-width:620px;margin:0 auto;padding:12px 0 40px}
.kiosk h1{font-size:34px}
.ta{display:block;font-family:"Noto Sans Tamil",sans-serif;font-weight:400;color:var(--muted);font-size:.82em;line-height:1.5}

  if(st==='decay')extra=`<ellipse cx="${c+2}" cy="70" rx="${W/6}" ry="6" fill="var(--t-decay)"/>`;
  if(st==='filled')extra=`<rect x="${c-W/4}" y="62" width="${W/2}" height="15" rx="5" fill="var(--t-filled)"/>`;
  if(st==='missing')extra=`<path d="M${c-6},62 L${c+6},76 M${c+6},62 L${c-6},76" stroke="var(--t-missing)" stroke-width="2" stroke-linecap="round"/>`;
  const g=`${root}<path class="cr" d="${cr}"/>${extra}`;
  return`<svg width="${Math.round(W*k)}" height="${Math.round(H*k)}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${up?g:`<g transform="translate(0,${H}) scale(1,-1)">${g}</g>`}</svg>`;
}

/* ---------- Doctor: my chair / consultation ---------- */
function vConsult(){
  const q=tq(),cur=q.find(x=>x.status==='in'),wait=q.filter(x=>x.status==='waiting').sort((a,b)=>a.token-b.token);
  if(!cur){const n=wait[0];
    return apprHTML()+(n?`<div class="chair"><div><div class="chair-k">Your chair is free. Next: token ${n.token} · ${n.source}</div><div class="chair-name">${esc(P(n.pid).name)}</div><div class="sm muted" style="margin-bottom:6px">${esc(P(n.pid).complaint||'')}${openCases(n.pid)[0]?' · '+caseLine(openCases(n.pid)[0]):''}</div>${alerts(P(n.pid))}</div><button class="btn primary lg" data-act="call" data-id="${n.id}">Call in</button></div>`:`<div class="chair"><div><div class="chair-k">Your chair is free</div><div class="chair-name">No one waiting</div></div></div>`)+
    `<section class="panel"><h2>Waiting · ${wait.length}</h2>${wait.map(x=>{const p=P(x.pid);return`<div class="row-item"><div><b>${x.token}. ${esc(p.name)}</b> ${catBadge(p.cat)}<div class="sm muted">${cap(waitTxt(x.time))} · ${esc(p.complaint||'')}</div>${alerts(p)}</div><button class="btn sm" data-act="call" data-id="${x.id}">Call in</button></div>`}).join('')||'<p class="muted sm">No one waiting.</p>'}</section>`;}
  const p=P(cur.pid);
  if(!ui.doc||ui.doc.qid!==cur.id){const oc=openCases(p.id);ui.doc={qid:cur.id,pid:p.id,teeth:new Set(),caseId:oc[0]?.id||'new',today:new Set(),tab:p.cat,rx:'',notes:'',nextIn:'',nextReason:'',close:null,oName:'',oPrice:''};
    if(oc[0]){const nx=oc[0].items.find(x=>!x.done);if(nx&&oc[0].ortho)ui.doc.today.add(nx.id)}}
  const d=ui.doc,cs=openCases(p.id),c=db.cases.find(x=>x.id===d.caseId);
  const items=c?c.items:[],todayItems=items.filter(x=>d.today.has(x.id)),total=sum(todayItems,x=>x.price);
  const allDone=c&&items.every(x=>x.done||d.today.has(x.id));const closeIt=d.close===null?!!allDone:d.close;
  const nextUp=c&&items.find(x=>!x.done&&!d.today.has(x.id));
  if(!d.nextReasonTouched)d.nextReason=nextUp?(nextUp.name+(nextUp.teeth.length?' '+nextUp.teeth.join(','):'')):'';
  const svcs=db.services.filter(s=>s.cat===d.tab&&s.active);
  return apprHTML()+`<div class="chead"><div><h1>${esc(p.title+' '+p.name)}</h1><p class="sub">Token ${cur.token} · ${cur.source} · Reg. ${p.reg} · ${p.age||'–'} ${p.sex} · ${p.cat==='o'?'Orthodontics':'General'}</p><p style="margin:6px 0 0"><b>Complaint:</b> ${esc(p.complaint||'–')}</p>${alerts(p)||'<div class="alerts"><span class="badge ok">No medical alerts</span></div>'}</div>
  <div class="pact"><button class="btn ghost" data-act="record" data-id="${p.id}">Full record</button><button class="btn ghost" data-act="unCall">Send back to queue</button></div></div>
  <div class="cokpi"><div>
  <section class="panel"><div class="ph"><h2><span class="step">1</span>On examination</h2><span class="sm muted">${d.teeth.size?'Selected '+[...d.teeth].join(', '):'Tap teeth to select'}</span></div>${chartHTML(p.id,true,.62)}
   <div class="marks"><span class="sm muted">Mark as</span>${Object.entries(MARKS).map(([k,l])=>`<button class="mk" data-act="mark" data-v="${k}" ${d.teeth.size?'':'disabled'}><i style="background:var(--t-${k})"></i>${l}</button>`).join('')}<button class="mk" data-act="mark" data-v="" ${d.teeth.size?'':'disabled'}>Healthy</button></div></section>
  <section class="panel"><div class="ph"><h2><span class="step">2</span>Treatment plan</h2><select data-change="caseSel" style="width:auto" aria-label="Treatment plan">${cs.map(x=>`<option value="${x.id}" ${x.id===d.caseId?'selected':''}>${esc(caseLine(x))}</option>`).join('')}<option value="new" ${d.caseId==='new'?'selected':''}>+ New treatment plan</option></select></div>
   ${c?`<div class="lbl">Tick what you did today</div>${items.map(x=>`<div class="planrow ${x.done?'done':''}">${x.done?`<span class="sm muted">✓</span>`:`<input type="checkbox" data-act="tickItem" data-id="${x.id}" ${d.today.has(x.id)?'checked':''} aria-label="Done today">`}<div><b>${esc(x.name)}</b>${x.teeth.length?` <span class="muted">· ${x.teeth.join(', ')}</span>`:''}${x.done?` <span class="sm muted">done ${fmtS(x.doneDate)}</span>`:''}</div>${x.done?`<span class="num muted">${inr(x.price)}</span>`:`<input type="number" min="0" value="${x.price}" data-itemprice="${x.id}" aria-label="Price">`}${x.done?'<span></span>':`<button class="icon" data-act="rmItem" data-id="${x.id}" aria-label="Remove">×</button>`}</div>`).join('')}`:'<p class="sm muted">New plan. Add treatments below.</p>'}
   <div class="lbl" style="margin-top:14px">Add to the plan ${d.teeth.size?'for teeth '+[...d.teeth].join(', '):'(select teeth first to attach them)'}</div>
   <div class="tabs" style="margin-bottom:10px">${[['g','General'],['o','Orthodontics']].map(([k,l])=>`<button class="tab ${d.tab===k?'on':''}" data-act="dtab" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="chips">${svcs.map(s=>`<button class="chip" data-act="addItem" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>
   <div class="row-actions"><input id="oName" placeholder="Not in the list? Type a treatment" value="${esc(d.oName)}" style="flex:1;min-width:200px"><input id="oPrice" type="number" min="0" placeholder="₹ price" value="${esc(d.oPrice)}" style="width:110px"><button class="btn" data-act="addOther">Add</button></div>
   <p class="sm muted" style="margin:6px 0 0">A typed treatment is saved to your service list automatically, so it shows as a quick pick next time.</p></section>
  <section class="panel"><h2><span class="step">3</span>Done today</h2>${todayItems.length?todayItems.map(x=>`<div class="due"><span>${esc(x.name)}${x.teeth.length?' · '+x.teeth.join(', '):''}</span><span>${inr(x.price)}</span></div>`).join('')+`<div class="due tot"><span>Today’s charge</span><span>${inr(total)}</span></div>`:'<p class="sm muted">Tick items in the plan that you did today.</p>'}
   <label style="margin-top:10px">Note (optional)<input data-in="notes" value="${esc(d.notes)}" placeholder="Anything to remember"></label>
   <div class="lbl">Prescription</div><div class="quick">${RX.map((r,i)=>`<button type="button" class="rxchip" data-act="rx" data-i="${i}">+ ${esc(r.split(',')[0])}</button>`).join('')}</div><textarea rows="3" data-in="rx" placeholder="One medicine per line">${esc(d.rx)}</textarea></section>
  <section class="panel"><h2><span class="step">4</span>Next visit</h2><div class="chips">${NEXTS.map(([v,l])=>`<button class="chip ${d.nextIn===v?'on':''}" data-act="nextIn" data-v="${v}">${l}</button>`).join('')}</div>
   ${d.nextIn?`<label>Reason<input data-in="nextReason" value="${esc(d.nextReason)}"></label>`:''}
   ${c||d.caseId!=='new'?`<label class="check"><input type="checkbox" data-act="closeTick" ${closeIt?'checked':''}> Treatment complete, close this plan</label>`:''}<p class="sm muted" style="margin:6px 0 0">Reception books the slot and takes payment.</p></section>
  <div class="savebar"><div><b>${todayItems.length?todayItems.map(x=>esc(x.name)).join(', ')+' · '+inr(total):'Tick at least one treatment done today'}</b><span>${d.nextIn?`Next visit in ${NEXTS.find(n=>n[0]===d.nextIn)[1]}${d.nextReason?': '+esc(d.nextReason):''}`:'No next visit'}${d.rx?' · prescription':''}</span></div><button class="btn primary lg" data-act="docSave">Send to reception</button></div>
  </div><aside class="cside"><section class="panel"><h2>Previous visits</h2>${visitsList(p.id,4)}</section></aside></div>`;
}
function visitsList(pid,n){const vs=db.visits.filter(v=>v.pid===pid&&v.stage!=='checkout').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n||99);
  return vs.length?`<ol class="tl">${vs.map(v=>`<li><div class="tl-h"><b>${fmtD(v.date)}</b><span class="sm muted">${inr(v.total)}</span></div><div>${esc(v.services.map(s=>s.name+(s.teeth?.length?' '+s.teeth.join(','):'')).join(', '))}</div>${v.notes?`<div class="sm muted">${esc(v.notes)}</div>`:''}${v.rx?`<div class="rx">℞ ${esc(v.rx)}</div>`:''}</li>`).join('')}</ol>`:'<p class="sm muted">First visit.</p>'}

/* ---------- Reception: checkout ---------- */
function vCheckout(){
  const list=tq().filter(x=>x.status==='checkout');
  if(!ui.co||!list.find(x=>x.id===ui.co.qid)){if(!list.length)return head('Checkout','Patients back from the doctor')+'<section class="panel"><div class="empty"><p>No one waiting to pay or book.</p></div></section>';coInit(list[0].id)}
  const x=list.find(y=>y.id===ui.co.qid),v=db.visits.find(y=>y.id===x.visitId),p=P(x.pid),c=db.cases.find(y=>y.id===v.caseId),co=ui.co;
  const charge=sum(co.lines,l=>l.price),prev=balBefore(p.id,v.id),due=prev+charge,paid=+co.paid||0,nb=due-paid;
  const nd=co.date;
  return head('Checkout',`${list.length} patient${list.length>1?'s':''} back from the doctor`)+
  (list.length>1?`<div class="tabs">${list.map(y=>`<button class="tab ${y.id===co.qid?'on':''}" data-act="coOpen" data-id="${y.id}">${y.token}. ${esc(P(y.pid).name)}</button>`).join('')}</div>`:'')+
  `<div class="grid2"><div>
  <section class="panel"><div class="ph"><h2>${esc(p.title+' '+p.name)}</h2><span class="sm muted">Reg. ${p.reg} · ${p.mobile}</span></div>
   <div class="lbl">Treatment today${c?' · '+esc(c.title):''}</div>
   ${co.lines.map((l,i)=>{const s=svByName(l.name),diff=s&&s.price!==l.price;return`<div class="due"><span>${esc(l.name)}${l.teeth.length?' · '+l.teeth.join(', '):''}${diff?` <span class="badge warn">list ${inr(s.price)}</span>`:''}</span><input type="number" min="0" value="${l.price}" data-coline="${i}" style="width:110px;text-align:right" aria-label="Price"></div>`}).join('')||'<p class="sm muted">No treatment charged.</p>'}
   <div class="due muted"><span>Previous balance</span><span>${inr(prev)}</span></div><div class="due tot"><span>Total due</span><span>${inr(due)}</span></div>
   <p class="sm muted" style="margin:6px 0 0">Changed a price? The doctor is asked whether to make it the new default.</p></section>
  <section class="panel"><h2>Payment</h2><div class="amt">₹<input type="number" min="0" data-in="paid" value="${esc(co.paid)}" aria-label="Amount received"></div>
   <div class="chips" style="margin-top:10px"><button class="chip ${paid===due&&co.paid!==''?'on':''}" data-act="coFull">Full ${inr(due)}</button><button class="chip ${co.paid==='0'?'on':''}" data-act="coNil">Nothing today</button></div>
   <div class="chips">${['Cash','UPI','Card'].map(m=>`<button class="chip ${co.mode===m?'on':''}" data-act="coMode" data-v="${m}">${m}</button>`).join('')}</div>
   <div class="bal ${nb<=0?'zero':''}"><span>${nb<0?'Advance':'Balance carried forward'}</span><b id="nb">${inr(Math.abs(nb))}</b></div></section>
  <section class="panel"><h2>Handled by</h2><div class="chips" style="margin:0">${[DOCTOR,'Junior doctor'].map(h=>`<button class="chip ${co.handled===h?'on':''}" data-act="coHandled" data-v="${h}">${h}</button>`).join('')}</div></section></div>
  <div>${v.rx?`<section class="panel"><div class="ph"><h2>Prescription</h2><button class="btn sm" data-act="printRx" data-id="${v.id}">Print</button></div><div class="rx">${esc(v.rx)}</div></section>`:''}
  <section class="panel"><h2>Next visit</h2>${v.suggest?`<p class="sm" style="margin-top:-4px">Doctor suggests: <b>${esc(v.nextReason||'review')}</b> in ${NEXTS.find(n=>n[0]===v.suggest)?.[1]||v.suggest+' days'}</p>`:'<p class="sm muted" style="margin-top:-4px">Doctor did not ask for a next visit.</p>'}
   <div class="chips">${[['book','Book now'],['remind','Remind later'],['none','No next visit']].map(([k,l])=>`<button class="chip ${co.nextMode===k?'on':''}" data-act="coNext" data-v="${k}">${l}</button>`).join('')}</div>
   ${co.nextMode!=='none'?`<div class="fgrid"><label>Reason<input data-in="coReason" value="${esc(co.reason)}"></label><label>Date<input type="date" data-in="coDate" value="${nd}" min="${today()}"></label>${co.nextMode==='book'?`<label>Time<select data-in="coTime">${SLOTS.map(s=>`<option ${s===co.time?'selected':''}>${s}</option>`).join('')}</select></label>`:''}</div>
   ${co.nextMode==='book'?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(p,remind(p,nd,co.reason,co.time))}">Send WhatsApp confirmation ↗</a>`:'<p class="sm muted" style="margin:0">Shows in Follow-ups on the date.</p>'}`:''}
   <p class="sm" style="margin:12px 0 0">Plan: ${c?(c.status==='closed'?'<span class="badge ok">Completed</span>':'<span class="badge warn">Ongoing</span> '+esc(caseLine(c))):'–'}</p></section>
  <section class="panel"><h2>Record sheet</h2>${sheetTable(p.id,{date:today(),text:co.lines.map(l=>(l.teeth.length?l.teeth.join(', ')+' ':'')+l.name).join(', '),charge,paid,pending:true,skipVisit:v.id})}</section></div></div>
  <div class="savebar"><div><b>${inr(paid)} received · ${nb<0?'advance '+inr(-nb):'balance '+inr(nb)}</b><span>${co.nextMode==='book'?'Next visit '+fmtD(nd)+' '+co.time:co.nextMode==='remind'?'Follow-up on '+fmtD(nd):'No next visit'} · ${esc(co.handled)}</span></div><button class="btn primary lg" data-act="coSave">Save and finish</button></div>`;
}
function coInit(qid){const x=db.queue.find(y=>y.id===qid),v=db.visits.find(y=>y.id===x.visitId);
  ui.co={qid,lines:v.services.map(s=>({...s})),paid:'',mode:'UPI',handled:DOCTOR,nextMode:v.suggest?'book':'none',date:addDays(today(),+(v.suggest||7)),time:'11:00',reason:v.nextReason||''}}
function sheetTable(pid,extra){
  const rows=[];db.visits.filter(v=>v.pid===pid&&(!extra||v.id!==extra.skipVisit)).forEach(v=>rows.push({date:v.date,text:v.services.map(s=>(s.teeth?.length?s.teeth.join(', ')+' ':'')+s.name).join(', ')||'Visit',charge:v.total,paid:sum(db.payments.filter(x=>x.visitId===v.id),x=>x.amount)}));
  db.payments.filter(x=>x.pid===pid&&!x.visitId).forEach(x=>rows.push({date:x.date,text:'Payment towards balance ('+x.mode+')',charge:0,paid:x.amount}));
  rows.sort((a,b)=>a.date.localeCompare(b.date));if(extra)rows.push(extra);let run=0;
  return`<div class="tw"><table class="sheet"><thead><tr><th>Date</th><th>Treatment record</th><th class="num">Payment</th><th class="num">Balance</th></tr></thead><tbody>${rows.map(r=>{run+=r.charge-r.paid;return`<tr ${r.pending?'style="background:var(--sunk);font-weight:600"':''}><td>${fmtS(r.date)}</td><td>${esc(r.text)}${r.charge?` <span class="muted">(${inr(r.charge)})</span>`:''}</td><td class="num">${r.paid?inr(r.paid):'–'}</td><td class="num" ${run>0?'style="color:var(--bad)"':''}>${inr(run)}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">No visits yet.</td></tr>'}</tbody></table></div>`;
}

/* ---------- Doctor: dashboard + admin ---------- */

const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const longDate=d=>{const x=new Date(d+'T00:00:00');return`${ord(x.getDate())} ${x.toLocaleDateString('en-GB',{month:'long'})} ${x.getFullYear()}`};
function repDefaults(p){
  const vs=db.visits.filter(v=>v.pid===p.id&&v.services.length).sort((a,b)=>a.date.localeCompare(b.date));
  const lastCase=vs.length?vs[vs.length-1].caseId:null,use=vs.filter(v=>v.caseId===lastCase);
  const lines=[];use.forEach(v=>v.services.forEach(s=>{if(!s.price)return;const nm=s.name+(s.teeth?.length?' of '+s.teeth.join(','):'');const ex=lines.find(l=>l.name===nm);ex?ex.amount+=s.price:lines.push({name:nm,amount:s.price})}));
  const ch=db.charts[p.id]||{},g={};Object.entries(ch).forEach(([t,m])=>(g[m]=g[m]||[]).push(t));
  const DX={decay:'dental caries in tooth no.',missing:'missing tooth no.',rct:'root canal treated tooth no.',filled:'restored tooth no.',crown:'crowned tooth no.',implant:'implant in tooth no.'};
  const dx=Object.entries(g).filter(([m])=>m==='decay').map(([m,t])=>DX[m]+' '+t.sort().join(',')).join(' and ')||'[diagnosis]';
  const tx=[...new Set(use.flatMap(v=>v.services.filter(s=>!/Consultation|X-ray|OPG|Review/.test(s.name)).map(s=>s.name.toLowerCase()+(s.teeth?.length?' of '+s.teeth.join(','):''))))];
  const txt=tx.length?cap(tx.join(' and ')):'[Treatment]';
  const body=`This is to inform that ${p.title} ${p.name}, ${ageOf(p)||'[age]'}-year-old ${p.sex==='F'?'female':'male'} patient visited our hospital with the chief complaints of ${(p.complaint||'[complaint]').toLowerCase()}. On correlation of chief complaint with clinical examination, patient was diagnosed with ${dx} which ${dx.includes(',')||dx.includes(' and ')?'were':'was'} causing the issue. ${txt} ${tx.length>1?'were':'was'} done to relieve the pain.`;
  return{body,lines:lines.length?lines:[{name:'Consultation',amount:200}]};
}

function initRepSig(){const c=$('#rsig');if(!c)return;const rc=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=rc.width*dpr;c.height=rc.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap='round';g.strokeStyle='#1b2a6b';

const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
function registerRows(D){const rows=[],seen=new Set();
  const mk=(pid,q,v,a)=>{const p=P(pid),ap=a||db.appointments.find(x=>x.pid===pid&&x.date===D&&x.status!=='cancelled');
    const inT=(q&&q.inTime)||(v&&v.inTime)||'',outT=(q&&q.outTime)||(v&&v.outTime)||'';
    const done=v&&v.services.length,proc=done?v.services.map(s=>s.name+(s.teeth?.length?' '+s.teeth.join(','):'')).join(', '):(ap?.reason||procOf(pid));
    const pay=sum(db.payments.filter(x=>x.pid===pid&&x.date===D),x=>x.amount);
    const balD=sum(db.visits.filter(x=>x.pid===pid&&x.date<=D),x=>x.total)-sum(db.payments.filter(x=>x.pid===pid&&x.date<=D),x=>x.amount);
    const st=q?q.status:v?'done':'notyet';
    return{key:(v?.id||q?.id||ap?.id||pid),pid,p,reg:p.reg,name:p.name,age:ageOf(p),sex:p.sex||'',mobile:p.mobile,proc,planned:!done,appt:ap?ap.time:'',walkin:!ap,inT,outT,dur:inT&&outT?mins(outT)-mins(inT):null,remarks:(v&&v.remarks)||(q&&q.remarks)||'',remRef:v?'v:'+v.id:q?'q:'+q.id:'',pay,bal:balD,doc:(v&&v.handled)||(st==='in'?DOCTOR:''),st}};
  db.queue.filter(q=>q.date===D).forEach(q=>{const v=q.visitId?db.visits.find(x=>x.id===q.visitId):db.visits.find(x=>x.pid===q.pid&&x.date===D);if(v)seen.add(v.id);rows.push(mk(q.pid,q,v))});
  db.visits.filter(v=>v.date===D&&!seen.has(v.id)).forEach(v=>rows.push(mk(v.pid,null,v)));
  db.appointments.filter(a=>a.date===D&&a.status==='booked'&&!rows.some(r=>r.pid===a.pid)).forEach(a=>rows.push(mk(a.pid,null,null,a)));
  return rows}

const seg=(act,cur,opts,extra='')=>`<div class="seg" role="radiogroup" ${extra}>${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${cur===v}" class="${cur===v?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
const sw=(attr,on,label)=>`<button type="button" class="switch ${on?'on':''}" role="switch" aria-checked="${on}" ${attr} aria-label="${label}"><i></i></button>`;
emptyP=function(){return{title:'Mr.',name:'',age:'',sex:'',dob:'',address:'',mobile:'',emergNo:'',emergRel:'',email:'',prof:'',office:'',ref:'',phys:'',physPh:'',med:[],other:'',preg:false,nurse:false,allergy:'',complaint:'',cat:'g',consent:false,sig:false,forOther:false,oName:'',oRel:''}};
function validateReg(r,kiosk){const e={},t=today();
  if(!r.name.trim())e.name='Enter the full name';else if(!/^[A-Za-z .']{2,60}$/.test(r.name.trim()))e.name='Letters, spaces and dots only';
  if(!r.sex)e.sex='Choose one';
  if(r.dob){if(r.dob>t)e.dob='Date of birth cannot be in the future';else if(ageOf({dob:r.dob})>120)e.dob='Check the year'}
  if(!r.dob&&(r.age===''||r.age==null))e.age='Enter age or date of birth';else if(r.age!==''&&r.age!=null&&!(+r.age>=0&&+r.age<=120&&Number.isInteger(+r.age)))e.age='Age must be 0 to 120';
  if(!/^[6-9]\d{9}$/.test(r.mobile||''))e.mobile=r.mobile?'Must be 10 digits starting with 6, 7, 8 or 9':'Enter the mobile number';
  if(r.emergNo&&!/^[6-9]\d{9}$/.test(r.emergNo))e.emergNo='10 digits';
  if(r.emergNo&&!r.emergRel)e.emergRel='Who is this?';
  if(r.office&&!/^\d{10,11}$/.test(r.office))e.office='10 or 11 digits';
  if(r.physPh&&!/^\d{10,11}$/.test(r.physPh))e.physPh='10 or 11 digits';
  if(r.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(r.email))e.email='Check the email';
  if(!r.address.trim()||r.address.trim().length<6)e.address='Enter the address';
  if(!r.complaint.trim())e.complaint='What brings you in?';
  if(!r.consent)e.consent='Please tap “I agree”';
  if(!r.sig&&!r.id)e.sig='Please sign';
  if(r.forOther){if(!r.oName.trim())e.oName='Your name';if(!r.oRel.trim())e.oRel='Relationship'}
  return e}

  <div class="fgrid">${f('mobile','Mobile number',{num:1,req:1,ph:'10 digits'})}${f('email','Email',{type:'email'})}${f('emergNo','Emergency contact number',{num:1,ph:'10 digits'})}${f('emergRel','Relation to patient',{ph:'e.g. Husband'})}${f('prof','Profession')}${f('office','Office phone',{num:1,max:11})}${f('ref','Referred by')}${f('phys','Family physician')}${f('physPh','Doctor’s phone',{num:1,max:11})}</div></section>
  <section class="panel"><h2>Are you currently undergoing treatment for any of these?</h2><p class="sm muted" style="margin:-6px 0 10px">Tap all that apply.</p>

  <h2 class="grp">Today <span>${rows.length}</span></h2><ul class="rows fdl">${active.map(row).join('')||'<li class="empty-line">No one yet today.</li>'}</ul>

function xlDate(v){if(v==null||v==='')return'';if(v instanceof Date&&!isNaN(v))return v.toLocaleDateString('en-CA');if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?'':d.toISOString().slice(0,10)}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y>30?1900:2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)||d.getDate()!==+m[1]?'':d.toLocaleDateString('en-CA')}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;return''}
function parseSheet(rows){const out=[];rows.forEach((r,i)=>{if(!r||r.every(c=>c===''||c==null))return;
  const reg=String(r[0]??'').trim();if(i===0&&!/^\d+$/.test(reg))return;// header row
  const issues=[],warn=[];const name=String(r[2]??'').trim().replace(/\s+/g,' ');
  if(!/^\d+$/.test(reg))issues.push('Reg No. is not a number');if(!name)issues.push('Name is empty');
  let mob=String(r[4]??'').replace(/\D/g,'');if(mob.length===12&&mob.startsWith('91'))mob=mob.slice(2);let land='';if(mob&&!/^[6-9]\d{9}$/.test(mob)){if(/^0\d{9,10}$/.test(mob)){land=mob;warn.push(`“${r[4]}” is a landline, saved as office phone`)}else warn.push(`Mobile “${r[4]}” is not 10 digits, left blank`);mob=''}

  if(t.dataset.r==='age'){const v=t.value.replace(/\D/g,'').slice(0,3);if(v!==t.value)t.value=v}
  if(t.dataset.r&&ui.regErr&&ui.regErr[t.dataset.r]){delete ui.regErr[t.dataset.r];const l=t.closest('label');if(l){l.classList.remove('bad');const em=l.querySelector('em');if(em)em.remove()}}
  if(t.dataset.in==='remarks'){ui.doc.remarks=t.value;return}
  if(t.dataset.rec&&t.dataset.f!=='svc'){const r=ui.doc.recs[+t.dataset.rec];r[t.dataset.f]=t.value;return}
  if(t.dataset.rep){ui.rep[t.dataset.rep]=t.value;const pv=$('.preview');if(pv)pv.innerHTML=repDoc(ui.rep);return}
  if(t.dataset.rline){const l=ui.rep.lines[+t.dataset.rline];l[t.dataset.f]=t.dataset.f==='amount'?+t.value||0:t.value;const pv=$('.preview');if(pv)pv.innerHTML=repDoc(ui.rep);return}
  if(t.id==='search'){ui.search=t.value;const r=resultsHTML();$('#results').innerHTML=r?`<div class="list" style="margin-bottom:14px">${r}</div>`:''}
  else if(t.id==='psearch'&&(ui.view==='treg'||ui.view==='preg')){ui.psearch=t.value;const pos=t.selectionStart;render();const n=$('#psearch');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==='psearch'){ui.psearch=t.value;const s=t.value.trim().toLowerCase();const l=db.patients.filter(p=>(!s||p.name.toLowerCase().includes(s)||p.mobile.includes(s)||String(p.reg).includes(s))&&(ui.pTab!=='dues'||bal(p.id)>0)&&(ui.pTab!=='o'||p.cat==='o'));$('#plist').innerHTML=plist(l)}
  else if(t.id==='oName')d.oName=t.value;else if(t.id==='oPrice')d.oPrice=t.value;
  else if(t.dataset.in==='notes')d.notes=t.value;else if(t.dataset.in==='rx')d.rx=t.value;
  else if(t.dataset.in==='nextReason'){d.nextReason=t.value;d.nextReasonTouched=true}
  else if(t.dataset.itemprice){const c=db.cases.find(x=>x.id===d.caseId);c.items.find(x=>x.id===t.dataset.itemprice).price=+t.value||0}
  else if(t.dataset.in==='paid'){ui.co.paid=t.value}
  else if(t.dataset.coline){ui.co.lines[+t.dataset.coline].price=t.value===''?null:+t.value}
  else if(t.dataset.in==='coReason')ui.co.reason=t.value;
  else if(t.dataset.r&&t.type!=='checkbox'){ui.reg[t.dataset.r]=t.value;if(t.dataset.r==='dob'&&t.value){ui.reg.age=String(Math.floor((Date.now()-new Date(t.value))/31557600000));const a=$('[data-r="age"]');if(a)a.value=ui.reg.age}}
});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.change;
  if(t.dataset.in==='paid'||t.dataset.coline||t.dataset.itemprice||t.dataset.in==='coReason')render();
  else if(t.dataset.in==='coDate'){ui.co.date=t.value;render()}else if(t.dataset.in==='coTime'){ui.co.time=t.value;render()}
  else if(c==='caseSel'){ui.doc.caseId=t.value;ui.doc.today.clear();ui.doc.close=null;ui.doc.nextReasonTouched=false;render()}
  else if(c==='apPt'){ui.apptPid=t.value==='new'?null:t.value;$('#apNew').hidden=t.value!=='new'}
  else if(c==='apDate'){ui.apptDate=t.value;render()}
  else if(t.dataset.rline&&t.dataset.f==='amount')render();
  else if(t.dataset.staffrole){db.staff.find(x=>x.id===t.dataset.staffrole).role=t.value;toast('Role saved')}
  else if(t.dataset.staffact){db.staff.find(x=>x.id===t.dataset.staffact).active=t.checked}
  else if(t.dataset.rec&&t.dataset.f==='svc'){const r=ui.doc.recs[+t.dataset.rec];r.svcId=t.value;r.planItemId=null;if(t.value==='other'){r.name=''}else if(t.value){const s=SV(t.value);r.name=s.name;r.price=s.price?String(s.price):''}else r.name='';render()}
  else if(t.dataset.rec&&t.dataset.f==='price')render();
  else if(c==='xlImport'){const f=t.files[0];if(f)importXL(f);t.value=''}
  else if(c==='iSrc'){ui.iSrc=t.value;render()}
  else if(c==='tPay'){ui.tPay=t.value;render()}
  else if(c==='tFrom'){ui.tFrom=t.value;if(ui.tTo&&ui.tTo<t.value)ui.tTo=t.value;render()}
  else if(c==='tTo'){ui.tTo=t.value;render()}
  else if(c==='tCat'){ui.tCat=t.value;render()}
  else if(c==='tOwe'){ui.tOwe=t.checked;render()}
  else if(c==='iFrom'){ui.iFrom=t.value;render()}
  else if(c==='iTo'){ui.iTo=t.value;render()}
  else if(c==='iCat'){ui.iCat=t.value;render()}
  else if(c==='istat'){ui.istat=t.value;render()}
  else if(c==='regDate'){ui.regDate=t.value;render()}
  else if(t.dataset.remark){const[k,id]=t.dataset.remark.split(':');const o=k==='v'?db.visits.find(x=>x.id===id):db.queue.find(x=>x.id===id);o.remarks=t.value;toast('Remark saved')}
  else if(c==='dsortk'){ui.sorts.doc.k=t.value;render()}
  else if(c==='icat'){ui.ifilter=t.value;render()}
  else if(c==='invNewToggle'){$('#invNew').hidden=t.value!=='new';const it=db.inventory.find(i=>i.id===t.value);if(it)t.form.min.value=it.min}
  else if(t.dataset.invmin){db.inventory.find(i=>i.id===t.dataset.invmin).min=+t.value||0;toast('Alert level saved')}
  else if(c==='repPt'){ui.rep.pid=t.value;if(t.value)Object.assign(ui.rep,repDefaults(P(t.value)));render()}
  else if(c==='repUpload'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{ui.rep.sig=rd.result;render()};rd.readAsDataURL(f)}
  else if(t.dataset.svcprice){SV(t.dataset.svcprice).price=+t.value||0;toast('Price saved')}
  else if(t.dataset.svcmark){SV(t.dataset.svcmark).marks=t.value}
  else if(t.dataset.svcact){SV(t.dataset.svcact).active=t.checked}
  else if(t.dataset.med){const m=ui.reg.med;t.checked?m.push(t.dataset.med):m.splice(m.indexOf(t.dataset.med),1)}
  else if(t.dataset.r&&t.type==='checkbox'){ui.reg[t.dataset.r]=t.checked;if(t.dataset.r==='forOther')render()}
  else if(t.dataset.r==='sex'){ui.reg.sex=t.value;render()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,form=f.dataset.form,fd=new FormData(f);
  if(form==='reg'){const r=ui.reg;r.emerg=r.emergNo?(r.emergNo+(r.emergRel?' · '+r.emergRel:'')):(r.emerg||'');
    const errs=validateReg(r,ui.view==='kiosk');if(Object.keys(errs).length){ui.regErr=errs;render();toast('Please check the highlighted fields');const b=document.querySelector('label.bad,.badbtn,.badbox,div.bad');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});return}
    ui.regErr=null;
    const dupM=db.patients.find(p=>p.mobile===r.mobile&&p.id!==r.id&&p.name.toLowerCase()!==r.name.trim().toLowerCase());if(dupM&&!r.dupOk&&ui.view!=='kiosk'){r.dupOk=true;toast(`Note: ${dupM.name} (Reg. ${dupM.reg}) has the same mobile. Press again to save anyway.`);return}
    const data={title:r.title,name:r.name.trim(),sex:r.sex,age:+r.age||null,dob:r.dob,address:r.address,mobile:r.mobile.replace(/\s/g,''),emerg:r.emerg,email:r.email,prof:r.prof,office:r.office,ref:r.ref,phys:r.phys,physPh:r.physPh,med:[...r.med],other:r.other,preg:r.preg,nurse:r.nurse,allergy:r.allergy,complaint:r.complaint,cat:r.cat,sig:!!r.sig,forOther:r.forOther?{name:r.oName,rel:r.oRel}:null};
    if(r.id){Object.assign(P(r.id),data,{verified:true});toast('Patient details saved');ui.reg=null;go(ui.rec===r.id&&ui.prevView==='record'?'record':'today');return}
    const dup=db.patients.find(p=>p.mobile===data.mobile&&p.name.toLowerCase()===data.name.toLowerCase());
    const p=dup||{id:'p'+uid(),reg:db.nextReg++,created:today(),...data,verified:ui.view!=='kiosk'};if(!dup)db.patients.push(p);
    if(ui.view==='kiosk'){const tok=addToQueue(p.id,ui.kiosk.qr?'QR':'Tablet');ui.kiosk={...ui.kiosk,step:'done',token:tok||'–',name:p.name.split(' ')[0]};ui.reg=null;render();return}
    addToQueue(p.id,'Walk-in');ui.reg=null;go('today');return}
  if(form==='kOld'){const m=String(fd.get('m')).replace(/\D/g,''),p=db.patients.find(x=>x.mobile===m);
    if(!p){ui.reg={...emptyP(),mobile:m};ui.kiosk.step='form';toast('We could not find that number. Please fill the form.');render();return}
    const tok=addToQueue(p.id,'Tablet')||tq().find(x=>x.pid===p.id&&x.status!=='done')?.token;ui.kiosk={...ui.kiosk,step:'done',token:tok,name:p.name.split(' ')[0]};render();return}
  if(form==='appt'){let pid=ui.resched?db.appointments.find(a=>a.id===ui.resched).pid:fd.get('pid');const E={};
    const dt=String(fd.get('date')||'');if(!dt||dt<today())E.d='Choose today or a later date';else if(dt===today()&&fd.get('time')<=nowT())E.d='That time has passed';
    if(pid==='new'){const n0=String(fd.get('newName')).trim(),m0=String(fd.get('newPhone')).replace(/\D/g,'');if(!/^[A-Za-z .']{2,60}$/.test(n0))E.n='Enter the name';if(!/^[6-9]\d{9}$/.test(m0))E.m='10 digits, starting 6 to 9'}
    if(Object.keys(E).length){ui.bookErr=E;render();return}ui.bookErr=null;
    if(ui.resched){const old=db.appointments.find(a=>a.id===ui.resched);old.status='cancelled';if(!bookAppt(pid,dt,fd.get('time'),String(fd.get('reason')))){old.status='booked';return}toast(`Moved to ${fd.get('time')} on ${fmtD(dt)}`);ui.resched=null;ui.bookOpen=false;render();return}
    if(pid==='new'){const n=String(fd.get('newName')).trim(),m=String(fd.get('newPhone')).replace(/\D/g,'');
      let p=db.patients.find(x=>x.mobile===m);if(!p){p={...emptyP(),id:'p'+uid(),reg:db.nextReg++,created:today(),name:n,mobile:m,med:[],sig:false,verified:false,forOther:null};db.patients.push(p)}pid=p.id}
    if(bookAppt(pid,fd.get('date'),fd.get('time'),String(fd.get('reason')))){ui.apptDate=fd.get('date');ui.apptPid=null;ui.apptReason='';toast(`Booked ${P(pid).name} at ${fd.get('time')} on ${fmtD(fd.get('date'))}`);ui.bookOpen=false;render()}return}
  if(form==='addStaff'){db.staff.push({id:uid(),name:String(fd.get('name')).trim(),role:fd.get('role'),phone:String(fd.get('phone')||''),active:true});toast(fd.get('name')+' added');render();return}
  if(form==='invIn'){let it=db.inventory.find(i=>i.id===fd.get('item'));const qty=+fd.get('qty'),cost=+fd.get('cost'),exp=fd.get('expiry')||'';
    if(!(Number.isInteger(qty)&&qty>0)){toast('Quantity must be a whole number above 0');return}
    if(!(cost>=0)||fd.get('cost')===''){toast('Enter the total cost (0 if free)');return}
    if(exp&&exp<today()){toast('That expiry date has already passed');return}
    if(!(+fd.get('min')>=0)||fd.get('min')===''){toast('Enter the stock level to be alerted at');return}
    if(!it){const n=String(fd.get('name')).trim();if(!n){toast('Enter the item name');return}it={id:'i'+uid(),name:n,cat:fd.get('cat'),unit:String(fd.get('unit')||'unit'),min:0,batches:[]};db.inventory.push(it)}
    it.min=+fd.get('min')||0;const date=fd.get('date')||today(),vendor=String(fd.get('vendor')||'');
    it.batches.push({id:uid(),qty,expiry:exp,cost,date,vendor});db.invLog.push({id:uid(),date,itemId:it.id,type:'in',qty,note:'Purchase'+(vendor?' · '+vendor:'')});
    if(cost>0)db.expenses.push({id:uid(),date,category:it.cat==='Instruments'?'Equipment':'Consumables',item:`${it.name} × ${qty}`,amount:cost,vendor});
    ui.inv=null;toast(`${qty} ${it.unit} of ${it.name} added · ${inr(cost)} added to expenses`);render();return}
  if(form==='invUse'){const it=db.inventory.find(i=>i.id===fd.get('item'));let q=+fd.get('qty');if(q>invQty(it)){toast(`Only ${invQty(it)} in stock`);return}
    const used=q;it.batches.filter(b=>b.qty>0).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).forEach(b=>{const k=Math.min(b.qty,q);b.qty-=k;q-=k});
    db.invLog.push({id:uid(),date:today(),itemId:it.id,type:'out',qty:used,note:String(fd.get('note')||'Used')});ui.inv=null;
    toast(invQty(it)<=it.min?`Low stock: ${it.name} is down to ${invQty(it)}. Time to reorder.`:`${used} ${it.unit} of ${it.name} used`);render();return}
  if(form==='addSvc'){db.services.push({id:'s'+uid(),cat:fd.get('cat'),name:String(fd.get('name')).trim(),price:+fd.get('price'),marks:'',note:'',active:true});toast('Service added');render();return}
  if(form==='addExp'){db.expenses.push({id:uid(),date:fd.get('date'),category:fd.get('category'),item:fd.get('item'),amount:+fd.get('amount'),vendor:fd.get('vendor')});toast('Expense added');render();return}
  if(form==='clinic'){db.clinic.name=fd.get('name');db.clinic.phone=fd.get('phone');db.clinic.template=fd.get('template');toast('Saved');render();return}
});
if(location.hash==='#form'){ui.reg=emptyP();ui.kiosk={step:'form',qr:true};ui.view='kiosk'}
render();

</script>
